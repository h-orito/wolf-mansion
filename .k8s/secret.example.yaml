# wolf-mansion-secrets のテンプレート。
#
# 実値を含む Secret は git にコミットしないこと。
# このファイルをコピーして実値を埋め、手動で apply する:
#
#   cp secret.example.yaml secret.yaml
#   # secret.yaml を実値で編集 (secret.yaml は .gitignore 済み)
#   kubectl apply -f secret.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: wolf-mansion-secrets
  namespace: default
type: Opaque
stringData:
  # JWT 署名鍵。HS256 のため 32 byte 以上必須。
  JWT_SECRET: "REPLACE_WITH_32BYTE_OR_LONGER_RANDOM_SECRET"
  # MySQL ユーザー名 / パスワード。
  WOLF_MANSION_DB_USERNAME: "wmansion"
  WOLF_MANSION_DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  # 外部連携トークン (未使用なら空文字でも可、ただしキー自体は定義しておくこと)。
  WOLF_MANSION_MASTODON_ACCESS_TOKEN: "REPLACE_OR_EMPTY"
  WOLF_MANSION_DISCORD_WEBHOOK_URL: "REPLACE_OR_EMPTY"
  WOLF_MANSION_DISCORD_MASTER_USERID: "REPLACE_OR_EMPTY"
  WOLF_MANSION_MICROSOFT_TRANSLATOR_KEY: "REPLACE_OR_EMPTY"
