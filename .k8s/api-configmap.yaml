apiVersion: v1
kind: ConfigMap
metadata:
  name: wolf-mansion-api-config
  namespace: default
data:
  # CORS ホワイトリスト (カンマ区切り)。cutover 後の本番ドメインに合わせること。
  ALLOWED_ORIGINS: "https://wolfort.dev"
  # クラスタ内 MySQL のホスト名。実際のサービス名に合わせて調整すること。
  MYSQL_HOST: "mysql-svc.default.svc.cluster.local"
  WOLF_MANSION_DB_NAME: "werewolf_mansiondb"
  # DB ユーザー名は Secret 側で管理する (nit: 認証情報の一部として一緒に扱う)
