spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:4306/werewolf_mansiondb?character_set_server=utf8mb4
    username: wmansion
    password: wmans10n
    driverClassName: com.mysql.cj.jdbc.Driver
  messages:
    basename: messages
    cache-seconds: -1
    encoding: UTF-8

server:
  servlet:
    contextPath: /wolf-mansion-api
  port: 8089
  tomcat:
    max-part-count: 3000
    max-parameter-count: 10000

logging:
  level:
    org.springframework: INFO
    root: INFO
    org.seasar.dbflute: ERROR
  file.name: /var/log/werewolf-mansion/tomcat.log

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  debug: true
  original-image:
    basedir: /var/www/html/wmansion/original
    baseurl: /wmansion/original
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  cookie:
    secure: false  # local 開発は http で動くため false。本番は true (各 profile で上書き)
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-override-in-prod-32bytes-min}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 1209600

mastodon:
  oauth:
    host: mstdn.jp
    access-token:

discord:
  webhook-url:
  master-userid:

microsoft:
  translator:
    key: 