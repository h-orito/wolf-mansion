spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${WOLF_MANSION_DB_NAME}?character_set_server=utf8mb4
    username: ${WOLF_MANSION_DB_USERNAME}
    password: ${WOLF_MANSION_DB_PASSWORD}
    driverClassName: com.mysql.cj.jdbc.Driver
    hikari:
      # DB (wolf-db) は 1 コア相当・max_connections=200 を全アプリで共有するため、
      # プール上限で DB への同時接続数に蓋をする
      maximum-pool-size: 40
      minimum-idle: 5
  thymeleaf:
    cache: false
    mode: HTML
  messages:
    basename: messages
    cache-seconds: -1
    encoding: UTF-8
server:
  servlet:
    contextPath: /wolf-mansion-api
    session:
      timeout: 86400
  port: 8081
  tomcat:
    max-part-count: 3000
    max-parameter-count: 10000
    use-relative-redirects: true
    basedir: /app/logs/
    accesslog:
      enabled: true
      suffix: .log
      prefix: wolf-mansion-access_log
      file-date-format: .yyyy-MM-dd
      max-days: 30
      pattern: '%t "%r" %s %b "%{Referer}i" "%{User-Agent}i" %{X-Forwarded-For}i %D %S %I'
    remoteip.remote-ip-header: true
    use-forward-headers: true

logging:
  level:
    org.springframework: INFO
    root: INFO
    org.seasar.dbflute: ERROR
  file.name: /app/logs/wolf-mansion.log

app:
  debug: false
  original-image:
    basedir: /var/www/html/wmansion/original
    baseurl: /wmansion/original

mastodon:
  oauth:
    host: mstdn.jp
    access-token: ${WOLF_MANSION_MASTODON_ACCESS_TOKEN}

slack:
  webhook-url: ${WOLF_MANSION_SLACK_WEBHOOK_URL}

discord:
  webhook-url: ${WOLF_MANSION_DISCORD_WEBHOOK_URL}
  master-userid:

microsoft:
  translator:
    key: ${WOLF_MANSION_MICROSOFT_TRANSLATOR_KEY}

jwt:
  secret: ${WOLF_MANSION_JWT_SECRET}
  access-token-validity-minutes: 15
  refresh-token-validity-days: 14
  cookie-secure: true

login-rate-limit:
  window-minutes: 15
  max-per-account: 5
  max-per-ip: 30

# OpenAPI spec は本番に公開しない (型生成は dev / CI でのみ実施)
springdoc:
  api-docs:
    enabled: false
