name: deploy_frontend_to_ocl

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-ocl.yml'

jobs:
  build-frontend:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pinned pnpm)
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Supply chain audit
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ghcr.io/h-orito/wolf-mansion-frontend:latest \
            --push \
            frontend/

  deploy:
    needs: build-frontend
    runs-on: [self-hosted, k8s]
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.26.8'

      - name: Restart deployment
        run: kubectl rollout restart deployment/wolf-mansion-frontend -n default
