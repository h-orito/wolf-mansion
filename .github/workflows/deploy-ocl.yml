name: deploy_to_ocl

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build image with Jib
        working-directory: backend
        run: ./gradlew jibDockerBuild

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ghcr.io/h-orito/wolf-mansion-backend

  # NOTE (Step 2.1): Jib image は ghcr.io/h-orito/wolf-mansion-backend にリネーム済み。
  # 下記 deployment 名 (wolf-mansion) と k8s 側 manifest の image 参照は Step 11 (cutover) で
  # backend / frontend 分割と合わせて更新する。それまで本 workflow は main push 時のみ走る
  # dormant 状態 (移行は feature/monorepo 上で進行)。
  deploy:
    needs: build
    runs-on: [self-hosted, k8s]
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.26.8'

      - name: Restart deployment
        run: kubectl rollout restart deployment/wolf-mansion -n default
