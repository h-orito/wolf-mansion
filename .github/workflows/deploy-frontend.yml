name: push_frontend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/monorepo
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend.yml

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_DATABASE_URL="${{ secrets.VITE_FIREBASE_DATABASE_URL }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            -t ghcr.io/h-orito/wolf-mansion-frontend frontend/

      - name: Push image
        run: docker push ghcr.io/h-orito/wolf-mansion-frontend

  deploy:
    needs: build
    runs-on: [self-hosted, k8s]
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.26.8'

      - name: Restart deployment
        run: kubectl rollout restart deployment/wolf-mansion-frontend -n default
